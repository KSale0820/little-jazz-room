name: Chart and Exercise Builder Studio QA

on:
  pull_request:
    branches: [integration/clean-pixel-themes]
    paths:
      - 'web/src/pages/ChartBuilderPage.tsx'
      - 'web/src/pages/CreatePage.tsx'
      - 'web/src/pages/BuilderStudio.css'
      - 'web/scripts/check-builder-studio.mjs'
      - '.github/workflows/builder-studio.yml'
  workflow_dispatch:

jobs:
  builder-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local development server
        run: |
          npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/builder-studio-vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5174/ > /dev/null && break
            sleep 1
          done
          curl -f http://127.0.0.1:5174/
      - name: Capture builder states and verify saved IDs
        run: node scripts/check-builder-studio.mjs
      - name: Existing chart-to-routine contract
        run: node scripts/check-chart-routine-player-integration.mjs
      - name: Upload builder screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-studio-mobile-${{ github.run_number }}
          path: |
            web/docs/screenshots/builder-studio-qa/
            web/docs/screenshots/chart-routine-player-integration/
          if-no-files-found: warn
