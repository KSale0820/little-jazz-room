name: Approved P02 Recorded Audio Regression
on:
  pull_request:
    branches: [class-demo-2026-10-31]
    paths:
      - 'web/**'
      - '.github/workflows/p02-recorded-audio-regression.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/p02-vite.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:5174/ > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5174/ > /dev/null
      - name: Recorded audio and approved P02 browser acceptance
        run: node scripts/check-p02-recorded-playback.mjs
      - name: Chart, routine and player integration regression
        run: node scripts/check-chart-routine-player-integration.mjs
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-p02-recording-regression-390x844-375x667
          path: |
            web/docs/screenshots/p02-recorded-audio/
            web/docs/screenshots/chart-routine-player-integration/
          if-no-files-found: warn
          retention-days: 14
      - name: Print dev server output on failure
        if: failure()
        run: tail -n 100 /tmp/p02-vite.log || true
