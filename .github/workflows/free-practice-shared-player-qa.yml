name: Free Practice shared player mobile QA

on:
  pull_request:
    branches: [class-demo-2026-10-31]
    paths:
      - 'web/src/pages/FreePracticePage.tsx'
      - 'web/src/pages/FreePracticePage.css'
      - 'web/src/pages/PracticePage.tsx'
      - 'web/scripts/check-free-practice-shared-player.mjs'
      - '.github/workflows/free-practice-shared-player-qa.yml'
  workflow_dispatch:

jobs:
  free-practice-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Production build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start local app
        run: |
          npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/little-jazz-free-practice.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5174/ > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5174/
      - name: Run Free Practice queue and player tests at two phone sizes
        run: node scripts/check-free-practice-shared-player.mjs
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-practice-shared-player-390x844-375x667
          path: web/docs/screenshots/free-practice-shared-player/
          retention-days: 14
          if-no-files-found: warn
      - name: Print local app log on failure
        if: failure()
        run: tail -n 70 /tmp/little-jazz-free-practice.log || true
