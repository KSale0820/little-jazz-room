name: Class MVP Home verification
on:
  push:
    branches: [class-demo-2026-10-31, class-demo-t01]
  workflow_dispatch:

jobs:
  home-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/little-jazz-room-vite.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:5174/ > /dev/null && break
            sleep 1
          done
      - name: Check H01 and capture screenshots
        run: node scripts/check-class-demo-home.mjs
      - name: Capture T01 Tracks Library at two iPhone sizes
        run: node scripts/check-class-demo-tracks.mjs
      - name: Upload iPhone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h01-mobile-screenshots
          path: web/docs/screenshots/class-demo/
          if-no-files-found: warn
