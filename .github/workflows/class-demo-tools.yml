name: P04 P05 functional tools visual QA
on:
  pull_request:
    branches: [class-demo-2026-10-31]
    paths:
      - 'web/src/pages/TunerPage.tsx'
      - 'web/src/pages/PracticePage.tsx'
      - 'web/src/pages/PracticePage.css'
      - 'web/src/pages/PracticePlayerApproved.css'
      - 'web/src/components/ChordGrid.tsx'
      - 'web/src/pages/ExplorePage.tsx'
      - 'web/src/pages/MetronomePage.tsx'
      - 'web/src/pages/ToolsPages.css'
      - 'web/src/pages/toolsAudio.ts'
      - 'web/scripts/check-class-demo-tools.mjs'
      - 'web/scripts/check-class-demo-integration.mjs'
      - 'web/scripts/check-class-demo-navigation.mjs'
      - 'web/scripts/check-p02-in-session-tools.mjs'
      - 'web/scripts/check-p02-chart-scale.mjs'
      - 'web/scripts/check-p02-overlay-webkit.mjs'
      - '.github/workflows/class-demo-tools.yml'
  workflow_dispatch:

jobs:
  tools-mobile-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Start app
        run: |
          npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/class-demo-tools-vite.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:5174/ > /dev/null && break
            sleep 1
          done
      - name: Browser checks and screenshots
        run: node scripts/check-class-demo-tools.mjs
      - name: Full routine, session, and progress walkthrough
        run: node scripts/check-class-demo-integration.mjs
      - name: Verify Player tool shortcuts and Explore chart navigation
        run: node scripts/check-class-demo-navigation.mjs
      - name: P02 free-only tool overlays preserve active session
        run: node scripts/check-p02-in-session-tools.mjs
      - name: Safari WebKit free practice overlays and timer
        run: node scripts/check-p02-overlay-webkit.mjs
      - name: Upload Safari overlay screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-safari-webkit-overlay-390x844-and-375x667
          path: web/docs/screenshots/class-demo-p02-webkit/
          if-no-files-found: warn
      - name: P02 Free chart large layout and no A/B/A labels
        run: node scripts/check-p02-chart-scale.mjs
      - name: Upload P02 enlarged Free chart screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-free-large-chart-390x844-and-375x667
          path: web/docs/screenshots/class-demo-p02-chart-scale/
          if-no-files-found: warn
      - name: Upload free/guided and tool overlay screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-in-session-tools-390x844-and-375x667
          path: web/docs/screenshots/class-demo-p02-overlays/
          if-no-files-found: warn
      - name: Upload navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-demo-navigation-fixed-390x844-and-375x667
          path: web/docs/screenshots/class-demo-navigation/
          if-no-files-found: warn
      - name: Upload integration screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-demo-full-walkthrough-390x844-and-375x667
          path: web/docs/screenshots/class-demo-integration/
          if-no-files-found: warn
      - name: Upload actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p04-p05-mobile-390x844-and-375x667
          path: web/docs/screenshots/class-demo-tools/P0*.png
          if-no-files-found: warn

