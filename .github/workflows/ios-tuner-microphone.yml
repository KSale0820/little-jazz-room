name: iOS tuner microphone permission regression

on:
  push:
    branches:
      - fix/ios-tuner-microphone-permission
  pull_request:
    paths:
      - 'web/ios/App/App/Info.plist'
      - 'web/scripts/configure-native-privacy.mjs'
      - 'web/src/native-audio/iosMicrophonePrivacy.test.ts'
      - '.github/workflows/ios-tuner-microphone.yml'

jobs:
  ios-permission:
    runs-on: macos-26
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium for existing browser-in-Vitest checks
        run: npx playwright install chromium
      - run: npm test
      - name: Ensure permission is in the root iOS plist
        run: |
          plutil -lint ios/App/App/Info.plist
          plutil -extract NSMicrophoneUsageDescription raw -o - ios/App/App/Info.plist
      - name: Sync native app and prove config script preserves root permission
        run: |
          npx cap sync ios
          npm run native:privacy
          plutil -lint ios/App/App/Info.plist
          plutil -extract NSMicrophoneUsageDescription raw -o - ios/App/App/Info.plist
          # Verify the iOS permission is unchanged after running the script twice.
          before=$(shasum ios/App/App/Info.plist | cut -d' ' -f1)
          npm run native:privacy
          after=$(shasum ios/App/App/Info.plist | cut -d' ' -f1)
          test "$before" = "$after"
          # Do not lint unrelated Android manifest generated by Capacitor.
          git diff --check -- ios/App/App/Info.plist
      - name: Compile unsigned iOS Simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
