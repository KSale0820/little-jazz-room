name: Native audio iOS scaffold and simulator compile

on:
  push:
    branches:
      - feature/native-audio-foundation

permissions:
  contents: write

jobs:
  ios-scaffold:
    runs-on: macos-26
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install pinned packages
        run: npm ci
      - name: Build web assets
        run: npm run build
      - name: Generate or sync Capacitor iOS project with Swift Package Manager
        run: |
          if [ ! -d ios/App/App.xcodeproj ]; then npx cap add ios --packagemanager SPM; fi
          npx cap sync ios
          npm run native:privacy
      - name: Commit generated iOS native project without touching web pages
        working-directory: .
        run: |
          git add web/ios
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(native): add iOS Capacitor project [skip ci]'
            git push origin HEAD:feature/native-audio-foundation
          fi
      - name: Build unsigned app for generic iOS Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
