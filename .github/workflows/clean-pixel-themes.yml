name: Clean pixel theme integration QA

on:
  push:
    branches: [integration/clean-pixel-themes]
    paths:
      - 'web/**'
      - '.github/workflows/clean-pixel-themes.yml'
  pull_request:
    branches: [integration/clean-pixel-themes]
    paths:
      - 'web/**'
      - '.github/workflows/clean-pixel-themes.yml'
  workflow_dispatch:

jobs:
  clean-pixel-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local Vite app
        run: |
          npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/clean-pixel-vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5174/ > /dev/null && break
            sleep 1
          done
          curl -f http://127.0.0.1:5174/
      - name: Routine player instruction/chart and save-preset QA
        run: node scripts/check-routine-player-refresh.mjs
      - name: Routine step preset builder and player QA
        run: node scripts/check-routine-step-presets.mjs
      - name: Capture Progress redesign reference screenshots
        run: node scripts/check-progress-redesign.mjs
      - name: Clean pixel Light/Dark x Cat Mode mobile matrix
        run: node scripts/check-clean-pixel-themes.mjs
      - name: Approved Profile Settings companion and appearance QA
        run: node scripts/check-profile-settings.mjs
      - name: Existing complete class walkthrough
        run: node scripts/check-class-demo-integration.mjs
      - name: Chart to practice and chart to routine reload paths
        run: node scripts/check-chart-routine-player-integration.mjs
      - name: Timer-first Free Practice end-to-end
        run: node scripts/check-free-practice.mjs
      - name: Upload screenshot and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-pixel-mobile-qa-${{ github.run_number }}
          path: |
            web/docs/screenshots/progress-redesign-qa/
            web/docs/screenshots/profile-settings-qa/
            web/docs/screenshots/clean-pixel-qa/
            web/docs/screenshots/free-practice/
            web/docs/screenshots/class-demo-integration/
            web/docs/screenshots/chart-routine-player-integration/
            web/docs/screenshots/routine-player-refresh/
            web/docs/screenshots/routine-step-presets/
            web/docs/approved-ui/TRACKS-AND-CHARTS-APPROVED-UI.png
            web/public/visuals/tracks-approved/tracks-title.png
            web/public/visuals/tracks-approved/jazz-study-shelf.png
          if-no-files-found: warn
