name: One-time Autumn Leaves audio reconstruction
on:
  push:
    branches:
      - feature/recorded-backing-tracks-foundation-2026-11-03
permissions:
  contents: write
jobs:
  add-audio:
    if: "!contains(github.event.head_commit.message, '[audio-complete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble and verify creator-supplied M4A
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/public/audio/backing-tracks
          cat .github/audio-staging/autumn-leaves.part0{0..6} | base64 --decode > web/public/audio/backing-tracks/autumn-leaves.m4a
          echo "9147983fe41de999ce934ed0e7e082c12bb43ac75593dd08eaa7b2fffcb9accc  web/public/audio/backing-tracks/autumn-leaves.m4a" | sha256sum -c -
          test "$(wc -c < web/public/audio/backing-tracks/autumn-leaves.m4a)" -eq 3971609
          test "$(git hash-object web/public/audio/backing-tracks/autumn-leaves.m4a)" = "1acd6abee87eeac7724346ab56199ab7a56cec0f"
      - name: Commit audio to PR branch and remove temporary transfer assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/public/audio/backing-tracks/autumn-leaves.m4a
          git rm -r .github/audio-staging
          git rm .github/workflows/assemble-autumn-leaves.yml
          git commit -m "Add owner-provided Autumn Leaves M4A (audio-only) [audio-complete]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
