<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/visuals/brand/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Playball&display=swap" rel="stylesheet" />
    <title>Little Jazz</title>
    <script>
      (function () {
        var mode = null;
        var cats = false;
        try {
          mode = localStorage.getItem('little-jazz-room:appearance:v1');
          cats = localStorage.getItem('little-jazz-room:decorative-cats:v1') === 'true';
        } catch (_) { /* storage optional */ }
        var theme = mode === 'dark' || mode === 'light' ? mode :
          (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.catMode = cats ? 'on' : 'off';
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
