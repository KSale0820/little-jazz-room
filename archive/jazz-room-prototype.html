<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Jazz Room · Visual Prototype</title>
<style>
:root{--bg:#101b27;--panel:#1b2b38;--panel2:#263c48;--sage:#b4d3bc;--mint:#d4ead7;--peach:#f4c3ab;--lav:#bfb6dd;--cream:#f9f1dd;--muted:#a9bac1;--line:#435a62;--gold:#f8d79b;--shadow:0 14px 50px #07111a78;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;color:var(--cream)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#2a4056 0,transparent 50%),var(--bg);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}a{color:var(--sage)}.shell{display:grid;grid-template-columns:226px minmax(0,980px);max-width:1280px;min-height:100vh;margin:auto}.sidebar{border-right:1px solid #334650;background:#111f2bc9;padding:34px 19px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.4px;line-height:1.1}.brandmark{background:var(--sage);color:#253f3b;border:3px solid #73948a;box-shadow:4px 4px 0 #172c37;width:42px;height:42px;display:grid;place-items:center;font-size:25px;border-radius:10px}.tiny{font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;font-weight:800}.navs{display:grid;gap:7px}.nav{background:transparent;border:0;text-align:left;padding:13px 14px;border-radius:13px;color:#b7c8cd;display:flex;align-items:center;gap:12px}.nav span{font-size:20px}.nav.active{background:#374f53;color:var(--cream);box-shadow:inset 0 0 0 1px #61746e}.nav:hover{background:#273c44}.sidebarfoot{margin-top:auto;color:#8fa7ac;font-size:12px;line-height:1.6}.main{min-width:0;padding:32px 38px 100px}.head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:26px}.eyebrow{font-weight:700;letter-spacing:.16em;color:var(--sage);font-size:11px;text-transform:uppercase}.h1{font-family:Georgia,serif;font-size:clamp(27px,3.5vw,40px);font-weight:500;line-height:1.2;margin:5px 0 7px}.subtitle{color:#b5c6cd;font-size:14px;line-height:1.5}.avatar{background:#354752;width:42px;height:42px;display:grid;place-items:center;border:1px solid #728387;border-radius:50%;font-size:23px}.pill{border:1px solid #536b6d;background:#29424b;border-radius:100px;padding:7px 11px;color:#d6e4dd;font-size:12px;display:inline-flex;align-items:center;gap:7px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.panel{border:1px solid #52696980;border-radius:19px;background:linear-gradient(145deg,#253943,#1a2c38);box-shadow:var(--shadow);padding:20px}.panel h2{font-family:Georgia,serif;font-weight:500;font-size:21px;margin:0 0 12px}.section{display:flex;justify-content:space-between;align-items:center;margin:29px 0 12px;gap:10px}.section h2{margin:0;font-family:Georgia,serif;font-size:23px;font-weight:500}.section small{color:#9fb6ba}.btn{background:#b6d9bf;border:1px solid #d6e8cc;color:#1d3b36;padding:12px 17px;border-radius:12px;font-weight:800;box-shadow:0 4px 0 #6e9586;display:inline-flex;justify-content:center;align-items:center;gap:8px;transition:transform .15s}.btn:hover{transform:translateY(-2px)}.btn.secondary{background:#314953;color:#edf3e6;border:1px solid #617a7d;box-shadow:none}.btn.ghost{background:transparent;border:1px solid #526b70;color:var(--sage);box-shadow:none}.btn.small{padding:8px 12px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}.room{height:288px;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(160deg,#1c3549,#303b56 70%,#253643);border:5px solid #455c5b;box-shadow:inset 0 0 50px #0a1828;image-rendering:pixelated;margin:-3px -3px 17px}.room:before{content:"";position:absolute;left:0;right:0;bottom:0;height:45px;background:repeating-linear-gradient(90deg,#503d45 0 56px,#483741 56px 60px);border-top:9px solid #7c5e5c}.window{position:absolute;top:20px;left:12%;height:176px;width:54%;border:11px solid #725e6a;box-shadow:inset 0 0 0 7px #303748,0 7px 0 #413746;background:linear-gradient(#1b2944,#3a4a6a 72%,#2a4056);overflow:hidden}.window:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 17px,#bed3dc80 18px 19px,transparent 20px 42px);opacity:.55;animation:rain 3s linear infinite}.window:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:8px;background:#635262;box-shadow:0 82px 0 0 #635262}.moon{position:absolute;left:22px;top:13px;width:23px;height:23px;border-radius:50%;background:#f3d9b0;box-shadow:0 0 28px #e3c8c0}.lamp{position:absolute;right:18%;top:76px;width:35px;height:25px;background:#ebbd9e;clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);filter:drop-shadow(0 0 18px #eaa994)}.lamp:before{content:""}.lampstem{position:absolute;right:calc(18% + 16px);top:99px;height:115px;width:4px;background:#c0a19e}.lampglow{position:absolute;right:6%;top:57px;width:140px;height:130px;border-radius:100%;background:#e9a6a144;filter:blur(25px)}.plant{position:absolute;left:5%;bottom:27px;font-size:75px;text-shadow:2px 5px 0 #132a29;filter:saturate(.7)}.cat{position:absolute;left:53%;bottom:31px;font-size:78px;filter:drop-shadow(5px 5px 0 #21283f);animation:breathe 2.8s ease-in-out infinite;transform-origin:bottom}.record{position:absolute;right:10%;bottom:32px;font-size:46px}.roomtag{position:absolute;top:12px;right:12px;background:#1a2938bc;border:1px solid #657374;border-radius:100px;padding:5px 10px;color:#f8d6bd;font-size:11px}.roomcopy{font-size:14px;color:#d9e6df;line-height:1.6}.statrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.stat{background:#1b303c;padding:14px;border:1px solid #47615d;border-radius:13px;flex:1;min-width:110px}.stat strong{display:block;font-size:24px;color:var(--mint)}.stat small{color:#a9bec0}.routine-card,.exercise-card{padding:15px 17px;background:#1e313d;border:1px solid #455e63;border-radius:15px;display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.routine-card+.routine-card,.exercise-card+.exercise-card{margin-top:10px}.rc-title{font-weight:800;color:var(--cream);margin-bottom:6px}.meta{font-size:12px;color:#a5bdc2;line-height:1.6}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.tag{border-radius:5px;padding:4px 7px;font-size:10px;background:#384f55;color:#cfe3d6}.tag.pink{background:#534556;color:#f3cbd7}.progress{height:9px;border-radius:10px;overflow:hidden;background:#3f4e56;margin:14px 0}.progress>i{height:100%;background:linear-gradient(90deg,#95caaa,#edd2ac);display:block;border-radius:10px}.field{background:#162936;border:1px solid #4e686a;color:var(--cream);border-radius:11px;padding:12px 13px;width:100%;outline:none}.field::placeholder{color:#8ea7b2}.fieldlabel{display:block;font-size:12px;color:#ccdfd3;font-weight:750;margin:13px 0 6px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.formgrid>.full{grid-column:1/-1}.preview{background:#554657;border:1px solid #9f7e91;color:#f5cbd2;padding:4px 8px;border-radius:100px;font-size:11px;white-space:nowrap}.feature{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #465c61}.feature strong{font-size:14px}.muted{color:#9fb2b9;font-size:12px;line-height:1.5}.playerclock{font-size:64px;font-variant-numeric:tabular-nums;text-align:center;font-weight:700;letter-spacing:-.05em;color:#e2ead7;margin:14px 0}.playercontrols{display:flex;justify-content:center;gap:11px;align-items:center}.sliderline{display:grid;grid-template-columns:85px 1fr 40px;align-items:center;gap:12px;padding:11px 0;color:#d0e0d8;font-size:13px}input[type=range]{accent-color:#accdb5;width:100%}.bigemoji{font-size:44px}.toast{position:fixed;bottom:24px;right:25px;background:#e5e8c9;color:#233e34;padding:13px 18px;border-radius:14px;box-shadow:var(--shadow);max-width:300px;z-index:10;font-size:13px;display:none}.bottomnav{display:none}.empty{padding:17px;background:#233945;border:1px dashed #63777b;border-radius:12px;color:#bfcec8;font-size:13px}.hidden{display:none!important}.badgeicon{font-size:23px;background:#354750;border:1px solid #536d74;padding:8px 9px;border-radius:9px}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}@keyframes rain{from{transform:translateY(-20px)}to{transform:translateY(20px)}}@keyframes breathe{50%{transform:scaleY(.97)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{display:none}.main{padding:26px 20px 100px;max-width:750px;margin:auto;width:100%}.bottomnav{display:grid;position:fixed;bottom:0;left:0;right:0;height:77px;grid-template-columns:repeat(5,1fr);background:#142633f5;border-top:1px solid #60717a;z-index:9;backdrop-filter:blur(18px);padding:6px 5px max(8px,env(safe-area-inset-bottom))}.bottomnav .nav{padding:3px;border-radius:11px;flex-direction:column;gap:2px;justify-content:center;align-items:center;font-size:10px}.bottomnav .nav span{font-size:22px}.grid2{grid-template-columns:1fr}.room{height:245px}}@media(max-width:480px){.main{padding:18px 14px 100px}.h1{font-size:29px}.room{height:218px}.grid2,.split,.formgrid{grid-template-columns:1fr}.formgrid>.full{grid-column:auto}.stat strong{font-size:19px}.routine-card{padding:13px}.panel{padding:16px}.sidebarfoot{display:none}.playerclock{font-size:53px}.head{margin-bottom:20px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark">♫</span><span>little<br>jazz room</span></div><div class="tiny">A softer way to practice</div><nav class="navs" id="desktopnav"></nav><div class="sidebarfoot">🌧️ A place to grow, one note at a time.<br><br>VISUAL PROTOTYPE · LOCAL DATA</div></aside><main class="main"><div class="head"><div><div class="eyebrow">A little progress every day</div><h1 class="h1" id="pagetitle">Good evening, musician ♡</h1><div class="subtitle" id="pagesubtitle">Rainy nights and brighter notes.</div></div><span class="avatar" aria-label="Cozy cat companion">🐱</span></div><div id="content"></div></main></div><nav class="bottomnav" id="mobilenav" aria-label="Main navigation"></nav><div id="toast" class="toast" role="status"></div>
<script>
const names=['Home','Explore','Create','Practice','Profile'],emoji=['🏡','🎶','✏️','🎧','🌙'];let page='Home';
const catalog=[{id:'e1',title:'Major scales',category:'Technique',level:'Beginner',minutes:5,description:'Play a major scale through two octaves in a relaxed, even rhythm.'},{id:'e2',title:'Blues scale exploration',category:'Improvisation',level:'Beginner',minutes:5,description:'Try one simple phrase, then invent a response.'},{id:'e3',title:'Seventh-chord arpeggios',category:'Harmony',level:'Intermediate',minutes:5,description:'Play root, third, fifth, and seventh across a chord change.'},{id:'e4',title:'ii–V–I guide tones',category:'Harmony',level:'Intermediate',minutes:5,description:'Connect thirds and sevenths with minimal movement.'},{id:'e5',title:'Call-and-response solo',category:'Improvisation',level:'Beginner',minutes:5,description:'Improvise a two-bar answer to a two-bar musical question.'},{id:'e6',title:'Swing eighth notes',category:'Rhythm',level:'Beginner',minutes:5,description:'Practice a light triplet-based swing feel with a metronome.'},{id:'e7',title:'Walking bass basics',category:'Technique',level:'Intermediate',minutes:5,description:'Outline a blues with stepwise quarter-note motion.'},{id:'e8',title:'Chord-tone soloing',category:'Improvisation',level:'Intermediate',minutes:5,description:'Limit yourself to chord tones over ii–V–I.'},{id:'e9',title:'Comping patterns',category:'Harmony',level:'Intermediate',minutes:5,description:'Explore sparse rhythmic chord accents.'},{id:'e10',title:'Melody imitation',category:'Ear training',level:'Beginner',minutes:5,description:'Listen to a phrase and play it back by ear.'}];
const seeds=[{id:'r1',title:'My First Jazz Improvisation',creator:'Little Jazz Room',duration:15,level:'Beginner',steps:['e2','e5','e8'],visibility:'public',description:'A welcoming way to start making up your own phrases.'},{id:'r2',title:'Daily Jazz Warm-Up',creator:'Little Jazz Room',duration:10,level:'Beginner',steps:['e1','e6'],visibility:'public',description:'Find your sound before you begin.'},{id:'r3',title:'Learn a Blues Melody',creator:'Little Jazz Room',duration:20,level:'Beginner',steps:['e10','e2','e5'],visibility:'public',description:'Hear the blues, then try your own melody.'},{id:'r4',title:'ii–V–I Workout',creator:'Little Jazz Room',duration:15,level:'Intermediate',steps:['e3','e4','e8'],visibility:'public',description:'Smooth voice leading and stronger harmony.'},{id:'r5',title:'Swing and Timing Practice',creator:'Little Jazz Room',duration:10,level:'Beginner',steps:['e6','e5'],visibility:'public',description:'Keep it swinging at your own pace.'},{id:'r6',title:'Intermediate Soloing Practice',creator:'Little Jazz Room',duration:30,level:'Intermediate',steps:['e3','e4','e8','e5'],visibility:'public',description:'Build fluid, intentional solos.'}];
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let myExercises=read('jazz-exercises',[]),myRoutines=read('jazz-routines',[]),saves=read('jazz-saves',[]),sessions=read('jazz-sessions',[]),selectedRoutine='r1',time=900,timer=null,playing=false,search='';
function allEx(){return [...catalog,...myExercises]}function allR(){return [...seeds,...myRoutines]}function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',3200)}
function nav(){const n=names.map((name,i)=>`<button class="nav ${page===name?'active':''}" onclick="go('${name}')"><span>${emoji[i]}</span>${name}</button>`).join('');document.getElementById('desktopnav').innerHTML=n;document.getElementById('mobilenav').innerHTML=n}
function go(s){if(page==='Practice'&&s!=='Practice'&&playing)pauseTimer();page=s;nav();document.getElementById('pagetitle').textContent=({Home:'Good evening, musician ♡',Explore:'Find your rhythm',Create:'Make something your own',Practice:'Time to find your flow',Profile:'Your musical journey'})[s];document.getElementById('pagesubtitle').textContent=({Home:'Rainy nights and brighter notes.',Explore:'Little routines from a big musical community.',Create:'Build an exercise, or a whole little ritual.',Practice:'No rush. Just the next note.',Profile:'Every little session counts.'})[s];render();window.scrollTo({top:0,behavior:'smooth'})}
function makeCard(r,kind='explore'){return `<div class="routine-card"><div style="min-width:0"><div class="rc-title">${esc(r.title)}</div><div class="meta">${esc(r.creator)} · ${r.duration} min · ${r.level}</div><div class="tags"><span class="tag">${r.steps.length} exercises</span><span class="tag pink">${esc(r.visibility)}</span></div></div><div style="display:grid;gap:8px;flex-shrink:0"><button class="btn secondary small" onclick="pickRoutine('${r.id}')">Practice</button>${kind==='explore'?`<button class="btn ghost small" onclick="saveRoutine('${r.id}')">${saves.includes(r.id)?'✓ Saved':'♡ Save'}</button>`:''}</div></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){const total=sessions.reduce((s,x)=>s+x.minutes,0);return `<div class="grid2"><div class="panel"><div class="room" role="img" aria-label="Original pixel-inspired cozy jazz room with a rainy window, warm lamp, and sleepy cat"><div class="window"><span class="moon"></span></div><div class="lampglow"></div><div class="lampstem"></div><div class="lamp"></div><div class="plant">🌿</div><div class="cat">🐈</div><div class="record">🎷</div><span class="roomtag">☾ rain outside</span></div><div class="roomcopy">Miso's keeping your seat warm. Want to play a few notes together?</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:13px"><button class="btn" onclick="pickRoutine('r1')">♫ Start practicing</button><button class="btn secondary" onclick="go('Create')">Build routine</button></div></div><div class="panel"><div class="eyebrow">Your little corner</div><h2>Small steps, sweet sounds</h2><div class="statrow"><div class="stat"><strong>${sessions.length}</strong><small>Sessions</small></div><div class="stat"><strong>${total}</strong><small>Minutes</small></div></div><div class="section"><strong>Weekly practice goal</strong><small>${Math.min(100,Math.round(total/60*100))}%</small></div><div class="progress"><i style="width:${Math.min(100,Math.round(total/60*100))}%"></i></div><div class="muted">60 minutes a week · No penalties for resting.</div><div class="section"><strong>Long-term dream</strong><span class="preview">Preview</span></div><div class="muted">Learn to improvise a blues solo 🎺</div><div class="progress"><i style="width:26%"></i></div><div class="feature"><span>🐾 Customize Miso's room</span><span class="preview">Soon</span></div></div></div><div class="section"><h2>A gentle place to begin</h2><small>Featured for you</small></div><div class="split">${seeds.slice(0,2).map(r=>makeCard(r,'home')).join('')}</div><div class="section"><h2>Coming around the corner</h2></div><div class="split"><div class="panel"><span class="badgeicon">🌱</span> <b>Friendly challenges</b><p class="muted">Practice 10 minutes with a friend. Community preview.</p><span class="preview">UI preview</span></div><div class="panel"><span class="badgeicon">🎀</span> <b>Cozy collectibles</b><p class="muted">Earn little room accessories by showing up.</p><span class="preview">UI preview</span></div></div>`}
function explore(){const rr=allR().filter(r=>r.visibility==='public'&&`${r.title} ${r.creator} ${r.level} ${r.description}`.toLowerCase().includes(search.toLowerCase()));return `<div class="panel" style="margin-bottom:17px"><div class="eyebrow">Community bookshelf</div><h2>Borrow a little inspiration</h2><input class="field" aria-label="Search routines" placeholder="Search routines, goals, levels..." value="${esc(search)}" oninput="search=this.value;renderExploreResults()"/></div><div class="section"><h2>Shared routines</h2><small id="count">${rr.length} to explore</small></div><div id="exploreresults" style="display:grid;gap:10px">${rr.map(r=>makeCard(r)).join('')||'<div class="empty">Nothing matches yet. Try a different search.</div>'}</div><div class="section"><h2>Practice with friends</h2></div><div class="panel"><span class="preview">UI preview</span><p class="muted">Follow friends, celebrate little wins, and participate in community challenges. Social features are for the next release.</p></div>`}
function renderExploreResults(){let rr=allR().filter(r=>r.visibility==='public'&&`${r.title} ${r.creator} ${r.level} ${r.description}`.toLowerCase().includes(search.toLowerCase()));document.getElementById('exploreresults').innerHTML=rr.map(r=>makeCard(r)).join('')||'<div class="empty">No matches yet.</div>';document.getElementById('count').textContent=rr.length+' to explore'}
function create(){return `<div class="grid2"><div class="panel"><div class="eyebrow">One little skill at a time</div><h2>Create an exercise</h2><form onsubmit="addExercise(event)"><label class="fieldlabel" for="ename">Exercise name</label><input required maxlength="90" id="ename" class="field" placeholder="e.g., Play a blues phrase in F"/><div class="formgrid"><div><label class="fieldlabel" for="ecategory">Category</label><select class="field" id="ecategory"><option>Improvisation</option><option>Melody</option><option>Harmony</option><option>Rhythm</option><option>Technique</option><option>Ear training</option><option>Warm-up</option></select></div><div><label class="fieldlabel" for="eduration">Minutes</label><input id="eduration" class="field" type="number" min="1" max="120" value="5"/></div></div><label class="fieldlabel" for="edesc">What should the musician do?</label><textarea id="edesc" class="field" rows="3" required placeholder="Write a few gentle, clear steps..."></textarea><button class="btn" style="margin-top:14px" type="submit">+ Save exercise locally</button></form></div><div class="panel"><div class="eyebrow">Compose a practice ritual</div><h2>Create a routine</h2><form onsubmit="addRoutine(event)"><label class="fieldlabel" for="rname">Routine name</label><input required maxlength="90" id="rname" class="field" placeholder="e.g., My Sunday warm-up"/><label class="fieldlabel" for="rdesc">Description</label><input id="rdesc" class="field" placeholder="A little something to work toward"/><label class="fieldlabel" for="rsteps">Exercises (multi-select)</label><select multiple required id="rsteps" class="field" style="height:150px">${allEx().map(e=>`<option value="${e.id}">${esc(e.title)} · ${e.minutes} min</option>`).join('')}</select><p class="muted">Use Ctrl/Cmd or Shift to select multiple. This is a visual prototype; the final builder will have drag-and-drop ordering.</p><button class="btn" type="submit">+ Save routine locally</button></form></div></div><div class="section"><h2>What you've made</h2></div><div class="split"><div class="panel"><h2>My exercises</h2>${myExercises.length?myExercises.map(e=>`<div class="feature"><span>${esc(e.title)}</span><span class="tag">${e.minutes} min</span></div>`).join(''):'<p class="muted">Your exercises will appear here.</p>'}</div><div class="panel"><h2>My routines</h2>${myRoutines.length?myRoutines.map(r=>`<div class="feature"><span>${esc(r.title)}</span><button class="btn ghost small" onclick="pickRoutine('${r.id}')">Practice</button></div>`).join(''):'<p class="muted">Your routines will appear here.</p>'}<p class="muted">Cross-device sharing requires Supabase. Not simulated here.</p></div></div>`}
function player(){const r=allR().find(x=>x.id===selectedRoutine)||seeds[0];return `<div class="grid2"><div class="panel"><div class="eyebrow">Now practicing · ${esc(r.title)}</div><div style="text-align:center;margin-top:20px;font-size:42px">🐈‍⬛ 🎼</div><div class="playerclock" id="clock">${fmt(time)}</div><div class="playercontrols"><button class="btn secondary" onclick="resetTimer()">↺ Reset</button><button class="btn" id="playbutton" onclick="toggleTimer()">${playing?'Ⅱ Pause':'▶ Start'}</button><button class="btn secondary" onclick="complete()">✓ Finish</button></div><p class="muted" style="text-align:center;margin-top:22px">A slow, steady pace counts just as much. ♡</p><div class="section"><h2>Exercises in this routine</h2></div>${r.steps.map((id,i)=>{let e=allEx().find(x=>x.id===id);return e?`<div class="feature"><span>${i+1}. ${esc(e.title)}</span><span class="tag">${e.minutes} min</span></div>`:''}).join('')}</div><div class="panel"><div class="eyebrow">Music corner</div><h2>Backing track mixer</h2><span class="preview">Interactive UI preview</span><label class="fieldlabel">Arrangement</label><select class="field"><option>12-bar blues in F</option><option>ii–V–I in C</option></select><div class="formgrid"><div><label class="fieldlabel">Tempo</label><input class="field" type="number" min="40" max="240" value="100"/></div><div><label class="fieldlabel">Key</label><select class="field">${['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'].map(k=>`<option ${k==='F'?'selected':''}>${k}</option>`).join('')}</select></div></div>${['Piano','Bass','Drums','Melody fade'].map(x=>`<div class="sliderline"><span>${x}</span><input type="range" aria-label="${x} level" min="0" max="100" value="${x==='Melody fade'?20:75}"/><span>♫</span></div>`).join('')}<p class="muted">The timer is functional. Mixer controls are visual previews until Tone.js is connected; no music is being played here.</p></div></div>`}
function profile(){const total=sessions.reduce((s,x)=>s+x.minutes,0);return `<div class="grid2"><div class="panel"><div class="eyebrow">Your little story</div><h2>Look how far you've come</h2><div style="font-size:58px;text-align:center;margin:20px">🐱 ☕</div><div class="statrow"><div class="stat"><strong>${sessions.length}</strong><small>Sessions</small></div><div class="stat"><strong>${total}</strong><small>Minutes</small></div><div class="stat"><strong>♡</strong><small>Rest is okay</small></div></div><div class="section"><strong>Weekly goal</strong><span>${Math.min(total,60)} / 60 min</span></div><div class="progress"><i style="width:${Math.min(100,total/60*100)}%"></i></div><p class="muted">Your progress is stored locally in this preview. It will sync between devices once authentication is enabled.</p></div><div class="panel"><div class="eyebrow">Collected along the way</div><h2>A little trophy shelf</h2><div class="feature"><span>🌱 First practice session</span>${sessions.length?'<span class="tag">Earned</span>':'<span class="preview">Not yet</span>'}</div><div class="feature"><span>🎵 Ten little minutes</span>${total>=10?'<span class="tag">Earned</span>':'<span class="preview">Not yet</span>'}</div><div class="feature"><span>🎀 Custom companion outfit</span><span class="preview">Preview</span></div><div class="feature"><span>👫 Friends and celebrations</span><span class="preview">Preview</span></div><div class="feature"><span>🏆 Challenges and badges</span><span class="preview">Preview</span></div></div></div><div class="section"><h2>Your practice journal</h2></div><div class="panel">${sessions.length?sessions.slice().reverse().map(s=>`<div class="feature"><span>${esc(s.title)}<br><span class="muted">${esc(s.date)}</span></span><span class="tag">${s.minutes} min</span></div>`).join(''):'<div class="empty">Your practice history will show up here after you finish your first session.</div>'}</div><div class="section"><h2>Saved routines</h2></div><div class="split">${allR().filter(r=>saves.includes(r.id)).map(r=>makeCard(r,'home')).join('')||'<div class="empty">Save a routine in Explore to keep it here.</div>'}</div>`}
function render(){document.getElementById('content').innerHTML=({Home:home,Explore:explore,Create:create,Practice:player,Profile:profile})[page]()}
function saveRoutine(id){saves=saves.includes(id)?saves.filter(x=>x!==id):[...saves,id];write('jazz-saves',saves);toast(saves.includes(id)?'Added to your little library ♡':'Removed from saved routines');render()}
function pickRoutine(id){selectedRoutine=id;const r=allR().find(x=>x.id===id);if(r)time=r.duration*60;go('Practice')}
function addExercise(e){e.preventDefault();let item={id:'e'+Date.now(),title:document.getElementById('ename').value.trim(),category:document.getElementById('ecategory').value,level:'Beginner',minutes:Number(document.getElementById('eduration').value),description:document.getElementById('edesc').value.trim()};if(!item.title||!item.description)return;myExercises.push(item);write('jazz-exercises',myExercises);toast('Your exercise was saved locally ♡');render()}
function addRoutine(e){e.preventDefault();const s=[...document.getElementById('rsteps').selectedOptions].map(x=>x.value);if(!s.length){toast('Choose at least one exercise');return}const rr={id:'r'+Date.now(),title:document.getElementById('rname').value.trim(),creator:'You',level:'Beginner',visibility:'private',description:document.getElementById('rdesc').value.trim(),steps:s,duration:s.reduce((n,id)=>n+(allEx().find(x=>x.id===id)?.minutes||0),0)};myRoutines.push(rr);write('jazz-routines',myRoutines);toast('Your routine was saved locally ♡');render()}
function toggleTimer(){if(playing){pauseTimer()}else{playing=true;timer=setInterval(()=>{time=Math.max(0,time-1);let el=document.getElementById('clock');if(el)el.textContent=fmt(time);if(time===0)complete()},1000)}render()}
function pauseTimer(){playing=false;if(timer)clearInterval(timer);timer=null}
function resetTimer(){pauseTimer();let r=allR().find(x=>x.id===selectedRoutine)||seeds[0];time=r.duration*60;render()}
function complete(){const r=allR().find(x=>x.id===selectedRoutine)||seeds[0];let elapsed=r.duration-Math.floor(time/60);if(elapsed<=0)elapsed=1;pauseTimer();sessions.push({title:r.title,minutes:elapsed,date:new Date().toLocaleDateString()});write('jazz-sessions',sessions);time=r.duration*60;toast('A little progress is still progress. Well played! ✨');go('Profile')}
nav();render();
</script></body></html>
